name: Test browser save editor

on:
  pull_request:
  push:
    branches-ignore: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate dependency lockfile
        run: node --test --test-isolation=none tests/package-lock.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
